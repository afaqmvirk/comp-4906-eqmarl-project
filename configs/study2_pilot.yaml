name: study2-depolarizing-pilot
environment: CoinGame-2
dynamics: mdp
n_episodes: 3000
steps_per_episode: 50
learning_seeds: [101, 202, 303, 404, 505]
frameworks: [eqmarl_psi_plus, sctde]
q_depolarizing: [0.0, 0.001, 0.003, 0.01, 0.03, 0.05, 0.10]
treatments:
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.0, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.001, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.003, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.01, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.03, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.05, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.10, seed: 101}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.0, seed: 202}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.01, seed: 202}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.03, seed: 202}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.10, seed: 202}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.0, seed: 303}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.01, seed: 303}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.03, seed: 303}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.10, seed: 303}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.0, seed: 404}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.01, seed: 404}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.03, seed: 404}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.10, seed: 404}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.0, seed: 505}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.01, seed: 505}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.03, seed: 505}
  - {framework: eqmarl_psi_plus, q_depolarizing: 0.10, seed: 505}
  - {framework: sctde, q_depolarizing: 0.0, seed: 101}
  - {framework: sctde, q_depolarizing: 0.0, seed: 202}
  - {framework: sctde, q_depolarizing: 0.0, seed: 303}
  - {framework: sctde, q_depolarizing: 0.0, seed: 404}
  - {framework: sctde, q_depolarizing: 0.0, seed: 505}
noise:
  definition: per_constituent_critic_qubit_per_network_leg
  legs: [server_to_agent, agent_to_server]
  backend: pauli_trajectory_adjoint
  trajectories_per_expectation: 1
  trajectory_bank_size: 1024
analysis:
  smoothing_window: 10
  targets: [20.0, 25.0]
  final_window: 100
diagnostics:
  observations: 16
  noise_samples: 16
  trajectories_per_expectation: 8
